max_connections     1000;
daemon              off;
srs_log_tank        console;
rtmp {
    listen              1935;
}
http_api {
    enabled         on;
    listen          1985;
}
http_server {
    enabled         on;
    listen          8080;
}
rtc_server {
    enabled on;
    listen 8000; # UDP port
    # @see https://ossrs.io/lts/en-us/docs/v7/doc/webrtc#config-candidate
    candidate $CANDIDATE;
}
rtsp_server {
    enabled on;
    listen 8554;
}
vhost __defaultVhost__ {
    hls {
        enabled         on;
    }
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
    rtc {
        enabled     on;
        # @see https://ossrs.io/lts/en-us/docs/v7/doc/webrtc#rtmp-to-rtc
        rtmp_to_rtc on;
        # @see https://ossrs.io/lts/en-us/docs/v7/doc/webrtc#rtc-to-rtmp
        rtc_to_rtmp on;
    }
    rtsp {
        enabled on;
        rtmp_to_rtsp on;
    }
}

# Example python_addons configuration demonstrating how to run a sample addon.
# Include this file from your main configuration with: `#include conf/python.addons.conf`.
python_addons {
    enabled on;

    addon {
        # Relative path resolved against the config working directory.
        script python_addon/srs_logger_example.py;
        # Optional command line arguments passed to the addon process.
        args "--message=Hello --interval=3";
        # Optional working directory; default is the config cwd when omitted.
        work_dir ./;
    }
}
