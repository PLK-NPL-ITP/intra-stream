#############################################################################################
# Last modified: 2025-11-02 Jason Yang
# Contributor: SRS Team, Jason Yang, Jasper, HyperKNF, Hayden, NPL ITP Team
#############################################################################################
# Intra-Stream 守护进程配置文件 - Ubuntu运行环境
# 启用的核心功能: RTMP, HLS, WebRTC, HTTP-FLV, SRT, GB28181, HTTP Server, DASH
# 
# 未使用的配置项:
# - HTTPS (安全传输)
# - Forward (流转发)
# - Exec (执行外部命令)
# - Ingest (拉流转推)
# - Transcode (转码)
# - Security/Refer (安全和防盗链)
# - HTTP Hooks (HTTP回调)
#############################################################################################

#############################################################################################
# 全局配置
#############################################################################################
max_connections     1000;           # 最大连接数
srs_log_tank        file;           # 日志输出到文件
srs_log_file        ./objs/srs.log; # 日志文件路径
daemon              on;              # 守护进程模式

#############################################################################################
# RTMP服务器配置
#############################################################################################
rtmp {
    listen              1935;        # RTMP监听端口
}

#############################################################################################
# HTTP API配置
#############################################################################################
http_api {
    enabled         on;
    listen          1985;            # HTTP API监听端口
}

#############################################################################################
# HTTP服务器配置
#############################################################################################
http_server {
    enabled         on;
    listen          8080;            # HTTP服务器监听端口
    dir             ./objs/nginx/html; # Web根目录
}

#############################################################################################
# WebRTC服务器配置
#############################################################################################
rtc_server {
    enabled on;
    listen 8000;                     # WebRTC UDP监听端口
    candidate $CANDIDATE;            # WebRTC候选地址
}

#############################################################################################
# SRT服务器配置
#############################################################################################
srt_server {
    enabled on;
    listen 10080;                    # SRT监听端口
    # 低延迟优化配置
    maxbw 1000000000;                # 最大带宽
    latency 20;                      # 延迟20ms(低延迟)
    recvlatency 20;
    peerlatency 20;
    tsbpdmode on;                    # 启用时间戳包传递
    tlpktdrop on;                    # 启用丢包机制
    connect_timeout 4000;
    peer_idle_timeout 8000;
}

#############################################################################################
# GB28181流转换器配置
#############################################################################################
stream_caster {
    enabled on;
    caster gb28181;
    output rtmp://127.0.0.1/live/[stream];
    listen 9000;                     # GB28181 TCP监听端口
}

#############################################################################################
# 虚拟主机配置
#############################################################################################
vhost __defaultVhost__ {
    # 启用低延迟模式
    min_latency on;                  # 最小延迟模式
    tcp_nodelay on;                  # 启用TCP_NODELAY降低延迟
    
    # 播放配置 - 低延迟优化
    play {
        gop_cache off;               # 关闭GOP缓存以降低延迟
        gop_cache_max_frames 2500;   # GOP缓存最大帧数
        queue_length 3;              # 减小队列长度(降低延迟)
        time_jitter full;            # 时间戳抖动修正
    }
    
    # 推流配置
    publish {
        mr off;                      # 关闭合并读取(降低延迟)
        firstpkt_timeout 20000;      # 首包超时
        normal_timeout 5000;         # 正常超时
        # RTMP优先使用annexb格式
        try_annexb_first on;         # 优先尝试ANNEXB格式解析
    }
    
    # HLS配置
    hls {
        enabled on;
        hls_fragment 2;              # HLS切片时长2秒(低延迟)
        hls_window 10;               # HLS窗口10秒
        hls_path ./objs/nginx/html;
        hls_m3u8_file [app]/[stream].m3u8;
        hls_ts_file [app]/[stream]-[seq].ts;
    }
    
    # HTTP-FLV配置
    http_remux {
        enabled on;
        mount [vhost]/[app]/[stream].flv;
        fast_cache 1;                # 快速缓存(低延迟)
    }
    
    # WebRTC配置
    rtc {
        enabled on;
        rtmp_to_rtc on;
        rtc_to_rtmp on;
        # WebRTC低延迟优化
        nack on;                     # 启用NACK
        twcc on;                     # 启用TWCC
        stun_timeout 30;
    }
    
    # DASH配置
    dash {
        enabled on;
        dash_fragment 2;             # DASH切片时长2秒(低延迟)
        dash_update_period 2;        # 更新周期2秒
        dash_timeshift 10;           # 时移缓冲10秒
        dash_path ./objs/nginx/html;
        dash_mpd_file [app]/[stream].mpd;
    }
    
    # SRT配置
    srt {
        enabled on;
        srt_to_rtmp on;              # SRT转RTMP
    }
    
    # DVR录制配置 - 录制live应用下的所有流
    dvr {
        enabled on;
        dvr_apply ^live/.*;          # 正则匹配live应用下的流
        dvr_plan segment;            
        # 录制路径: ./streams_records/[stream]/[2006].[01].[02].[15].[04].[05].mp4
        dvr_path ./streams_records/[stream]/[2006].[01].[02].[15].[04].[05].mp4;
        time_jitter full;            # 时间戳修正
    }
}

#############################################################################################
# Python扩展配置
#############################################################################################
python_addons {
    enabled on;
    restart 3;
    retry_interval 5;
    failure_exit on;

    addon {
        script python_addons/httpbackend_server.py;
        args "--conf=conf/intra-stream_daemon.conf";
        work_dir ./;
    }
}